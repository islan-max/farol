version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /src/farol/eslint
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node.js: só versões LTS (pares), trocadas à mão; o Dependabot sugeria a 25, que não é LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
