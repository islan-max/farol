name: Imagem de container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - pyproject.toml
      - uv.lock
      - src/**
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: farol:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça (usuário sem privilégios, Python e JavaScript)
        run: |
          set -euo pipefail
          docker run --rm farol:teste --version
          docker run --rm --entrypoint id farol:teste -u | grep -qx 10001
          demo="$(mktemp -d)"
          git -C "$demo" init -q -b main
          git -C "$demo" -c user.email=t@t.dev -c user.name=t commit -q --allow-empty -m base
          printf 'try:\n    pass\nexcept:\n    pass\n' > "$demo/a.py"
          printf 'var x = 1;\nif (x == 2) {}\n' > "$demo/b.js"
          git -C "$demo" add -N a.py b.js 2>/dev/null || git -C "$demo" add -N .
          saida="$(docker run --rm -v "$demo:/repo" farol:teste revisar --json)"
          echo "$saida"
          for regra in E722 no-var eqeqeq; do
            echo "$saida" | grep -q "\"codigo\": \"$regra\"" || { echo "faltou $regra"; exit 1; }
          done

      - name: Entrar no ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nomes e rótulos da imagem
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=v0,enable=${{ startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest

      - name: Publicar
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
