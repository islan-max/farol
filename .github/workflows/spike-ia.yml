name: Medição da IA local (descartável)

on:
  pull_request:
    paths: [".github/workflows/spike-ia.yml", "scripts/spike_ia.py"]

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_VERSAO: v0.40.13
      MODELO: qwen2.5-coder:1.5b
    steps:
      - name: Máquina
        run: |
          nproc
          free -m
          df -h / | tail -1
      - name: Baixar e conferir o Ollama
        run: |
          T0=$(date +%s)
          base=https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSAO
          curl -fsSL -o ollama-linux-amd64.tar.zst "$base/ollama-linux-amd64.tar.zst"
          curl -fsSL -o sha256sum.txt "$base/sha256sum.txt"
          grep ' ./ollama-linux-amd64.tar.zst$' sha256sum.txt | sed 's# ./# #' | sha256sum -c -
          mkdir -p "$HOME/ollama" && tar --zstd -xf ollama-linux-amd64.tar.zst -C "$HOME/ollama"
          ls "$HOME/ollama" "$HOME/ollama/bin" | head
          du -sh "$HOME/ollama"
          echo "TEMPO baixar+conferir+extrair: $(( $(date +%s) - T0 ))s"
      - name: Subir o servidor e baixar o modelo
        run: |
          T0=$(date +%s)
          export PATH="$HOME/ollama/bin:$PATH"
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo
          T1=$(date +%s)
          ollama pull "$MODELO"
          echo "TEMPO servidor: $((T1-T0))s; pull do modelo: $(( $(date +%s) - T1 ))s"
          du -sh "$HOME/.ollama"
      - name: Comparar modelos (tempo, memória e qualidade)
        run: |
          export PATH="$HOME/ollama/bin:$PATH"
          python3 scripts/spike_ia.py
