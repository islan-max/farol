name: Medição da IA local (descartável)

on:
  pull_request:
    paths: [".github/workflows/spike-ia.yml"]

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_VERSAO: v0.40.13
      MODELO: qwen2.5-coder:1.5b
    steps:
      - name: Máquina
        run: |
          nproc
          free -m
          df -h / | tail -1
      - name: Baixar e conferir o Ollama
        run: |
          T0=$(date +%s)
          base=https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSAO
          curl -fsSL -o ollama.tar.zst "$base/ollama-linux-amd64.tar.zst"
          curl -fsSL -o sha256sum.txt "$base/sha256sum.txt"
          grep ' ollama-linux-amd64.tar.zst$' sha256sum.txt | sha256sum -c -
          mkdir -p "$HOME/ollama" && tar --zstd -xf ollama.tar.zst -C "$HOME/ollama"
          ls "$HOME/ollama" "$HOME/ollama/bin" | head
          du -sh "$HOME/ollama"
          echo "TEMPO baixar+conferir+extrair: $(( $(date +%s) - T0 ))s"
      - name: Subir o servidor e baixar o modelo
        run: |
          T0=$(date +%s)
          export PATH="$HOME/ollama/bin:$PATH"
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo
          T1=$(date +%s)
          ollama pull "$MODELO"
          echo "TEMPO servidor: $((T1-T0))s; pull do modelo: $(( $(date +%s) - T1 ))s"
          du -sh "$HOME/.ollama"
      - name: Gerar 5 respostas e medir tempo e memória
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, time, urllib.request, threading
          pico = 0
          parar = False
          def amostrar():
              global pico
              while not parar:
                  out = subprocess.run("ps -eo rss,comm | awk '/ollama/ {s+=$1} END {print s+0}'", shell=True, capture_output=True, text=True).stdout
                  pico = max(pico, int(out.strip() or 0))
                  time.sleep(0.5)
          threading.Thread(target=amostrar, daemon=True).start()
          SISTEMA = ("Você é um mentor de programação. Responda sempre em português do Brasil, em no máximo "
                     "duas frases curtas, sem markdown, sem listas e sem blocos de código. Não mencione "
                     "outros problemas além do descrito.")
          casos = [
            ("`except:` sem tipo captura erro demais", "Um except sem nome de exceção captura qualquer erro, inclusive Ctrl+C.", 6, "    except:"),
            ("Valor padrão mutável em argumento de função", "Listas usadas como valor padrão são criadas uma única vez e compartilhadas entre chamadas.", 1, "def marcar(tarefa, feitas=[]):"),
            ("SQL montado juntando texto abre brecha para injeção de SQL", "Montar SQL colando valores permite que o valor altere a consulta.", 3, "    cursor.execute(f\"SELECT * FROM usuarios WHERE nome = '{nome}'\")"),
            ("Não use eval: ele executa texto como código", "eval executa o texto recebido como código JavaScript.", 2, "  return eval('(' + texto + ')');"),
            ("Variável criada e nunca usada", "Você guarda um valor em uma variável e nenhuma linha a lê depois.", 2, "    total = sum(precos) + frete"),
          ]
          for titulo, explicacao, linha, codigo in casos:
              pedido = {
                "model": "qwen2.5-coder:1.5b", "stream": False,
                "options": {"temperature": 0.2, "num_predict": 120, "num_ctx": 2048},
                "messages": [
                  {"role": "system", "content": SISTEMA},
                  {"role": "user", "content": f"Regra: {titulo}\nExplicação geral: {explicacao}\nTrecho da pessoa (linha {linha}):\n{codigo}\n\nEscreva 1 ou 2 frases ligando a explicação a este trecho: o que, neste código, pode dar errado e qual é a mudança. Use os nomes que aparecem no trecho."},
                ],
              }
              t0 = time.time()
              req = urllib.request.Request("http://127.0.0.1:11434/api/chat", data=json.dumps(pedido).encode(), headers={"Content-Type": "application/json"})
              r = json.load(urllib.request.urlopen(req, timeout=300))
              dt = time.time() - t0
              tokens = r.get("eval_count", 0)
              print(f"--- {titulo}")
              print(f"tempo total {dt:.1f}s | carga {r.get('load_duration',0)/1e9:.1f}s | {tokens} tokens em {r.get('eval_duration',0)/1e9:.1f}s ({tokens/max(r.get('eval_duration',1)/1e9,0.001):.1f} tok/s)")
              print(r["message"]["content"].strip())
          parar = True
          print(f"PICO de memória (soma RSS dos processos ollama): {pico/1024:.0f} MB")
          PYEOF
          free -m
