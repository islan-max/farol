name: Medição da IA local (descartável)

on:
  pull_request:
    paths: [".github/workflows/spike-ia.yml"]

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_VERSAO: v0.40.13
      MODELO: qwen2.5-coder:1.5b
    steps:
      - name: Máquina
        run: |
          nproc
          free -m
          df -h / | tail -1
      - name: Baixar e conferir o Ollama
        run: |
          T0=$(date +%s)
          base=https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSAO
          curl -fsSL -o ollama-linux-amd64.tar.zst "$base/ollama-linux-amd64.tar.zst"
          curl -fsSL -o sha256sum.txt "$base/sha256sum.txt"
          grep ' ./ollama-linux-amd64.tar.zst$' sha256sum.txt | sed 's# ./# #' | sha256sum -c -
          mkdir -p "$HOME/ollama" && tar --zstd -xf ollama-linux-amd64.tar.zst -C "$HOME/ollama"
          ls "$HOME/ollama" "$HOME/ollama/bin" | head
          du -sh "$HOME/ollama"
          echo "TEMPO baixar+conferir+extrair: $(( $(date +%s) - T0 ))s"
      - name: Subir o servidor e baixar o modelo
        run: |
          T0=$(date +%s)
          export PATH="$HOME/ollama/bin:$PATH"
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo
          T1=$(date +%s)
          ollama pull "$MODELO"
          echo "TEMPO servidor: $((T1-T0))s; pull do modelo: $(( $(date +%s) - T1 ))s"
          du -sh "$HOME/.ollama"
      - name: Comparar modelos (tempo, memória e qualidade)
        run: |
          export PATH="$HOME/ollama/bin:$PATH"
          python3 - <<'PYEOF'
          import json, subprocess, time, urllib.request
          def usado():
              return int(subprocess.run("free -m | awk '/Mem:/ {print $3}'", shell=True, capture_output=True, text=True).stdout)
          SISTEMA = ("Você é um mentor de programação. Responda sempre em português do Brasil, em no máximo "
                     "duas frases curtas, sem markdown, sem listas e sem blocos de código. Baseie-se só nas "
                     "informações dadas e não invente problemas novos.")
          casos = [
            ("`except:` sem tipo captura erro demais", "Captura qualquer erro, inclusive Ctrl+C.", "Quando algo dá errado por um motivo inesperado o programa segue em silêncio.", "Nomeie o erro que você espera tratar.", 4, "Do not use bare `except`",
             "def carregar(caminho):
    try:
        return open(caminho).read()
    except:
        return \"\""),
            ("Valor padrão mutável em argumento de função", "A lista padrão é criada uma única vez, na definição da função.", "Todas as chamadas compartilham o mesmo objeto.", "Use None como padrão e crie a lista dentro da função.", 1, "Do not use mutable data structures for argument defaults",
             "def marcar(tarefa, feitas=[]):
    feitas.append(tarefa)
    return feitas"),
            ("SQL montado juntando texto abre brecha para injeção de SQL", "A consulta é construída colando valores no texto SQL.", "O valor pode conter SQL e mudar o que a consulta faz.", "Use parâmetros: o driver envia o valor separado do SQL.", 2, "Possible SQL injection vector through string-based query construction",
             "def buscar(cursor, nome):
    cursor.execute(f\"SELECT * FROM usuarios WHERE nome = '{nome}'\")
    return cursor.fetchall()"),
            ("Não use eval: ele executa texto como código", "eval executa um texto como código JavaScript.", "Quem controla o texto passa a executar código na sua página.", "Para ler dados, use JSON.parse(texto).", 2, "`eval` can be harmful.",
             "function ler(texto) {
  return eval('(' + texto + ')');
}"),
            ("Variável criada e nunca usada", "Você guarda um valor em uma variável e nenhuma linha a lê depois.", "Quase sempre é um resultado que você esqueceu de usar.", "Use o valor ou apague a variável.", 2, "Local variable `total` is assigned to but never used",
             "def total_com_frete(precos, frete):
    total = sum(precos) + frete
    return sum(precos)"),
          ]
          for modelo in ["qwen2.5-coder:1.5b", "qwen2.5-coder:3b", "qwen2.5-coder:7b"]:
              t0 = time.time()
              subprocess.run(["ollama", "pull", modelo], check=True, capture_output=True)
              print(f"
########## {modelo}: pull {time.time()-t0:.0f}s")
              base = usado()
              for titulo, o_que, por_que, como, linha, msg, codigo in casos:
                  pedido = {"model": modelo, "stream": False, "keep_alive": "5m",
                    "options": {"temperature": 0.1, "num_predict": 140, "num_ctx": 2048},
                    "messages": [{"role": "system", "content": SISTEMA},
                      {"role": "user", "content": f"Regra: {titulo}
O que é: {o_que}
Por que importa: {por_que}
Como corrigir: {como}
A ferramenta apontou (linha {linha}): {msg}

Trecho da pessoa:
{codigo}

Escreva 2 frases curtas dirigidas a quem escreveu este trecho: o que está errado exatamente neste código (use os nomes do trecho) e qual mudança fazer."}]}
                  t1 = time.time()
                  req = urllib.request.Request("http://127.0.0.1:11434/api/chat", data=json.dumps(pedido).encode(), headers={"Content-Type": "application/json"})
                  r = json.load(urllib.request.urlopen(req, timeout=600))
                  n = r.get("eval_count", 0); d = r.get("eval_duration", 1) / 1e9
                  print(f"--- {titulo} | {time.time()-t1:.1f}s | {n} tokens | {n/max(d,0.001):.1f} tok/s")
                  print(r["message"]["content"].strip())
              print(f"MEMÓRIA usada a mais com {modelo} carregado: {usado()-base} MB")
              subprocess.run(["ollama", "stop", modelo], capture_output=True)
          PYEOF
