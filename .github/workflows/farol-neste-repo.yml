name: Farol neste repositório

# O Farol revisa os próprios PRs. Usa `pull_request` (nunca `pull_request_target`).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  farol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
