name: Medição do 7B (descartável)

on:
  pull_request:
    paths: [".github/workflows/spike-7b.yml", "scripts/spike_notas.py"]

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --no-dev
      - name: Máquina
        run: |
          nproc
          free -m | head -2
      - name: Instalar o Ollama
        run: bash scripts/instalar_ollama.sh qwen2.5-coder:1.5b
      - name: Gerar as notas com o código real do Farol
        run: |
          export PATH="$RUNNER_TEMP/ollama/bin:$PATH"
          uv run python scripts/spike_notas.py
