<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">Farol</title>
<desc id="d">Um farol com o feixe de luz varrendo a tela e o texto: Farol, revisão de pull request que ensina.</desc>
<defs>
  <linearGradient id="feixe" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#d4a72c" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#d4a72c" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="brilho">
    <stop offset="0" stop-color="#d4a72c" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#d4a72c" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .titulo { font: 700 92px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #1f2328; }
  .sub { font: 400 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .chip { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #59636e; }
  .seta { font: 400 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #59636e; }
  @keyframes pulso { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .lampada { animation: pulso 3.2s ease-in-out infinite; }
  .a1 { animation: entra .9s .1s both; }
  .a2 { animation: entra .9s .35s both; }
  .a3 { animation: entra .9s .6s both; }
  .a4 { animation: entra .9s .85s both; }
  .a5 { animation: entra .9s 1.1s both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<g>
  <animateTransform attributeName="transform" type="rotate" values="-7 170 124;7 170 124;-7 170 124" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
  <polygon points="170,124 1120,24 1120,224" fill="url(#feixe)"/>
</g>
<g>
  <animateTransform attributeName="transform" type="rotate" values="7 170 124;-7 170 124;7 170 124" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
  <polygon points="170,124 -300,60 -300,188" fill="url(#feixe)" opacity=".6"/>
</g>

<circle class="lampada" cx="170" cy="124" r="62" fill="url(#brilho)"/>
<g transform="translate(42 40) scale(4)">
  <path d="M26 28 L38 28 L42 58 L22 58 Z" fill="#57606a"/>
  <path d="M25 40 L39 40 L40 47 L24 47 Z" fill="#1a7f37"/>
  <rect x="14" y="58" width="36" height="4" rx="2" fill="#1a7f37"/>
  <path d="M23 14 L32 6 L41 14 Z" fill="#0969da"/>
  <rect x="25" y="14" width="14" height="14" rx="2" fill="#bf8700"/>
</g>

<text class="titulo a1" x="340" y="150">Farol</text>
<text class="sub a2" x="344" y="205">Revisão de pull request que <tspan font-weight="700" fill="#9a6700">ensina</tspan>.</text>

<g class="a3"><rect x="344" y="236" width="118" height="40" rx="20" fill="#ffffff" stroke="#d0d7de"/><text class="chip" x="403" y="262" text-anchor="middle">o que é</text></g>
<text class="seta a3" x="476" y="263">→</text>
<g class="a4"><rect x="506" y="236" width="170" height="40" rx="20" fill="#ffffff" stroke="#d0d7de"/><text class="chip" x="591" y="262" text-anchor="middle">por que importa</text></g>
<text class="seta a4" x="690" y="263">→</text>
<g class="a5"><rect x="720" y="236" width="150" height="40" rx="20" fill="#ffffff" stroke="#1a7f37"/><text class="chip" x="795" y="262" text-anchor="middle" style="fill: #1a7f37">como corrigir</text></g>
</svg>
